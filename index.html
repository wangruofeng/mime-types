<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #1f2328;
    --text-muted: #6b7280;
    --text-faint: #9ca3af;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --success: #16a34a;
    --success-soft: #f0fdf4;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --radius: 10px;
  }
  html.dark {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --border-strong: #484f58;
    --text: #e6edf3;
    --text-muted: #9198a1;
    --text-faint: #6e7681;
    --accent: #58a6ff;
    --accent-hover: #79b8ff;
    --accent-soft: #1a2332;
    --danger: #f87171;
    --danger-soft: #2a1a1c;
    --success: #4ade80;
    --success-soft: #0d2118;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 650; }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; font-size: 14px; font-weight: 700; line-height: 1;
  }
  .logo .sub { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .spacer { flex: 1; }

  .icon-btn {
    width: 36px; height: 36px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text-muted); cursor: pointer;
    display: grid; place-items: center; transition: all .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg); }
  .icon-btn svg { width: 18px; height: 18px; }
  header .icon-btn { border: none; background: transparent; }
  header .icon-btn:hover { background: var(--bg); border-color: transparent; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 10px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .search-wrap {
    display: flex; align-items: center; flex: 1; min-width: 240px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); padding: 0 10px; transition: all .15s;
  }
  .search-wrap:focus-within { border-color: var(--accent); background: var(--panel); }
  .search-wrap svg { width: 16px; height: 16px; color: var(--text-faint); flex-shrink: 0; }
  #search {
    flex: 1; border: 0; background: transparent; color: var(--text);
    padding: 9px 8px; font-size: 13px; outline: none;
  }
  #search::placeholder { color: var(--text-faint); }
  .seg {
    display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
    flex-wrap: wrap;
  }
  .seg button {
    height: 34px; padding: 0 11px; border: 0; background: var(--panel);
    color: var(--text-muted); font-size: 12.5px; cursor: pointer;
    border-right: 1px solid var(--border); transition: all .15s;
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: var(--bg); color: var(--text); }
  .seg button.active { background: var(--accent-soft); color: var(--accent); }

  .stat { font-size: 12px; color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .stat b { color: var(--text); font-weight: 600; }

  /* ---------- Main ---------- */
  main { flex: 1; overflow: auto; padding: 18px 20px 60px; }

  .table-wrap {
    max-width: 1200px; margin: 0 auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  thead {
    position: sticky; top: 0; z-index: 1;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  th {
    text-align: left; padding: 10px 12px; font-weight: 600; color: var(--text-muted);
    white-space: nowrap;
  }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr { transition: background .12s; cursor: pointer; }
  tbody tr:hover { background: var(--bg); }
  tbody tr:last-child td { border-bottom: 0; }

  .col-ext { width: 100px; }
  .col-mime { width: auto; }
  .col-cat { width: 80px; }
  .col-desc { width: 35%; }
  .col-action { width: 60px; text-align: right; }

  .ext-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    font-size: 12px; font-weight: 600; color: var(--accent);
    background: var(--accent-soft); border-radius: 6px;
    padding: 3px 8px; border: 1px solid var(--border);
  }
  .ext-pill::before { content: '.'; opacity: .7; }
  .mime-code {
    font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
    font-size: 12px; color: var(--text);
    word-break: break-all;
  }
  .cat-badge {
    display: inline-block; font-size: 11px; font-weight: 500;
    padding: 2px 8px; border-radius: 10px; background: var(--bg);
    color: var(--text-muted); border: 1px solid var(--border);
  }
  .desc-txt { color: var(--text-muted); }

  .copy-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text-muted); font-size: 12px; cursor: pointer;
    transition: all .12s; opacity: 0;
  }
  tr:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
  .copy-btn svg { width: 12px; height: 12px; }
  .copy-btn.copied { color: var(--success); border-color: var(--success); opacity: 1; }

  .empty-state {
    max-width: 640px; margin: 10vh auto 0; text-align: center;
    color: var(--text-muted); padding: 0 20px;
  }
  .empty-state .big-icon {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 16px;
    display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
  }
  .empty-state .big-icon svg { width: 30px; height: 30px; }
  .empty-state h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; color: var(--text); }
  .empty-state p { margin: 0; font-size: 13.5px; line-height: 1.7; }
  .empty-state .hint { margin-top: 14px; font-size: 12px; color: var(--text-faint); }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--panel);
    padding: 9px 16px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
    opacity: 0; pointer-events: none; transition: all .22s;
    z-index: 200; display: flex; align-items: center; gap: 7px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast svg { width: 15px; height: 15px; }

  .hidden { display: none !important; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  @media (max-width: 640px) {
    header { padding: 12px 14px; }
    .toolbar { padding: 8px 12px; gap: 8px; }
    main { padding: 12px 12px 50px; }
    .logo .sub { display: none; }
    .col-desc { display: none; }
    .col-cat { width: 64px; }
    .seg button { padding: 0 9px; font-size: 12px; }
    .copy-btn { opacity: 1; }
  }
</style>
</head>

const $ = (s) => document.querySelector(s);
const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

const CAT_LABELS = {
  docs: '文档',
  image: '图片',
  audio: '音频',
  video: '视频',
  font: '字体',
  archive: '压缩',
  code: '代码',
  data: '数据'
};

/* 已知的多段扩展名，按长度降序排列，用于文件名扩展名提取 */
const MULTI_PART_EXTS = ['tar.bz2', 'tar.lzma', 'tar.gz', 'tar.xz', 'tar.zst', 'tar.bz', 'tar.lz', 'tar.lzo', 'tar.Z'];

let currentCat = 'all';
let currentQuery = '';

/* ---------- 通用工具 ---------- */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  document.body.removeChild(ta);
  return ok;
}

let toastTimer;
function showToast(msg, ok = true) {
  const t = $('#toast');
  t.innerHTML = (ok
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
  ) + '<span>' + escapeHtml(msg) + '</span>';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copyAndToast(text, msg) {
  if (await copyText(text)) showToast(msg);
  else showToast('复制失败', false);
}

/* 从文件名提取扩展名，优先识别 .tar.gz 等多段后缀；若该多段后缀未收录，则回退到最后一段 */
function extFromFilename(name) {
  const lower = name.toLowerCase();
  for (const multi of MULTI_PART_EXTS) {
    if (lower.endsWith('.' + multi) && MIME_DATA.some(i => i.ext === multi)) {
      return multi;
    }
  }
  const idx = lower.lastIndexOf('.');
  if (idx <= 0 || idx === lower.length - 1) return lower;
  return lower.slice(idx + 1);
}

/* ---------- 搜索与过滤 ---------- */
function normalize(s) { return String(s).toLowerCase().replace(/\s+/g, ''); }

function matches(item, query) {
  if (!query) return true;
  const q = normalize(query);
  return normalize(item.ext).includes(q)
    || normalize(item.mime).includes(q)
    || normalize(item.desc).includes(q)
    || normalize(CAT_LABELS[item.cat]).includes(q);
}

function getFiltered() {
  let query = currentQuery;
  // 如果输入包含点号，按文件名处理，提取扩展名作为查询词
  if (query.includes('.')) {
    query = extFromFilename(query);
  }
  return MIME_DATA.filter(item => {
    const catOk = currentCat === 'all' || item.cat === currentCat;
    return catOk && matches(item, query);
  });
}

/* ---------- 渲染 ---------- */
function render() {
  const list = getFiltered();
  const main = $('#main');

  $('#totalStat').textContent = MIME_DATA.length;
  $('#matchStat').textContent = list.length;

  if (!currentQuery && currentCat === 'all') {
    main.innerHTML =
      '<div class="empty-state">' +
        '<div class="big-icon">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' +
        '</div>' +
        '<h2>输入关键词开始查询</h2>' +
        '<p>支持扩展名、MIME 类型、中文说明搜索；<br>也支持粘贴文件名自动提取扩展名（如 archive.tar.gz）。</p>' +
        '<div class="hint">点击表格行复制 MIME 类型，点击行尾按钮复制扩展名。</div>' +
      '</div>';
    return;
  }

  main.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  const table = document.createElement('table');
  table.innerHTML =
    '<thead><tr>' +
      '<th class="col-ext">扩展名</th>' +
      '<th class="col-mime">MIME 类型</th>' +
      '<th class="col-cat">类别</th>' +
      '<th class="col-desc">说明</th>' +
      '<th class="col-action"></th>' +
    '</tr></thead>';

  const tbody = document.createElement('tbody');
  if (list.length === 0) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td colspan="5" style="text-align:center;padding:32px 20px;color:var(--text-muted);">' +
      '未收录，可能为自定义格式<br><span style="font-size:12px;color:var(--text-faint)">换个关键词试试</span>' +
      '</td>';
    tbody.appendChild(tr);
  } else {
    list.forEach(item => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><span class="ext-pill">' + escapeHtml(item.ext) + '</span></td>' +
        '<td><code class="mime-code">' + escapeHtml(item.mime) + '</code></td>' +
        '<td><span class="cat-badge">' + escapeHtml(CAT_LABELS[item.cat]) + '</span></td>' +
        '<td class="desc-txt">' + escapeHtml(item.desc) + '</td>' +
        '<td class="col-action"><button class="copy-btn" title="复制扩展名">' + COPY_ICON + '</button></td>';

      // 点击行复制 MIME 类型
      tr.addEventListener('click', (e) => {
        if (e.target.closest('.copy-btn')) return;
        copyAndToast(item.mime, '已复制 MIME：' + item.mime);
      });

      // 点击按钮复制扩展名
      const btn = tr.querySelector('.copy-btn');
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (await copyText(item.ext)) {
          btn.classList.add('copied');
          const old = btn.innerHTML;
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
          showToast('已复制扩展名：' + item.ext);
          setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = old; }, 1200);
        } else {
          showToast('复制失败', false);
        }
      });

      tbody.appendChild(tr);
    });
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  main.appendChild(wrap);
}

/* ---------- 事件绑定 ---------- */
const searchInput = $('#search');
searchInput.addEventListener('input', () => {
  currentQuery = searchInput.value.trim();
  render();
});

const catButtons = document.querySelectorAll('#catSeg button');
catButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    currentCat = btn.dataset.cat;
    catButtons.forEach(b => b.classList.toggle('active', b === btn));
    render();
  });
});

/* 初始化分类控件激活状态 */
catButtons.forEach(b => b.classList.toggle('active', b.dataset.cat === 'all'));

/* ---------- 主题切换 ---------- */
const themeBtn = $('#themeBtn');
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
function setTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  themeBtn.innerHTML = dark ? SUN : MOON;
  themeBtn.title = dark ? '切换到浅色' : '切换到深色';
  try { localStorage.setItem('mime-theme', dark ? 'dark' : 'light'); } catch {}
}
themeBtn.addEventListener('click', () => setTheme(!document.documentElement.classList.contains('dark')));
try {
  const saved = localStorage.getItem('mime-theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(saved ? saved === 'dark' : prefersDark);
} catch { setTheme(false); }

/* 初始化统计 */
$('#totalStat').textContent = MIME_DATA.length;
$('#matchStat').textContent = MIME_DATA.length;
</script>
</body>
</html>
